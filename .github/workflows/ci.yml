name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU-only torch wheel (~200 MB) instead of the default CUDA build (~2 GB+)
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with train+dev extras
        # torch is already satisfied by the CPU wheel above, so [train]
        # only adds the light deps (tqdm, tensorboard) that training/ needs
        run: pip install -e ".[train,dev]"

      - name: Run test suite
        run: pytest -q
